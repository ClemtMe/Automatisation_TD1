services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: immo-api-php
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    ports:
      - "80:8080"
    environment:
      - MYSQL_HOST=db
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    depends_on:
      - db
    command: sh -c "composer install && php -S 0.0.0.0:80 -t ./public"

  db:
    image: mariadb:12
    container_name: immo-api-db
    restart: always
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: 1
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  adminer:
    image: adminer
    container_name: immo-api-adminer
    restart: always
    ports:
      - "8081:8080"

volumes:
    db_data: